# Database Configuration
# Default database location - can be overridden in the UI
# Use relative path (from project directory) or absolute path
# Relative example: ./data/sdp.db (creates 'data' folder in project directory)
# Absolute example: C:/DB/SDP1.db or D:/MyData/project.db
database.location=./data/sdp.db

# Auto-create database if not exists
database.auto.create=true

# Auto-create schema tables if not exists
database.auto.init.schema=true
